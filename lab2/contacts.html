<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ПАС — Контакты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="header">
        <div class="header-left">
            <img src="images/logo.png" alt="Логотип ПАС" width="50" height="50">
            <span class="logo-text">П<strong>А</strong>С</span>
        </div>
        <div class="header-right">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="catalog.html" class="nav-link">Каталог</a>
            <a href="composition.html" class="nav-link">Состав</a>
            <a href="contacts.html" class="nav-link active">Контакты</a>
        </div>
    </div>

    <div class="page-content">
        <h1 class="page-title">Свяжитесь с нами</h1>

        <div class="contact-info">
            <h2>Наши контакты</h2>
            <p><strong>Адрес:</strong> г. Cамара, ул. Верхне-карьерная, д. 3</p>
            <p><strong>Телефон:</strong> <a href="tel:+78001234567">8 (800) 123-45-67</a></p>
            <p><strong>Email:</strong> <a href="mailto:info@pas.ru">info@pas.ru</a></p>
            <p><strong>Режим работы:</strong> Пн–Пт, 9:00–18:00</p>
            <p>Полезная ссылка: <a href="https://www.mchs.gov.ru" target="_blank">Сайт МЧС России</a></p>
        </div>

        <div class="contact-form">
            <h2>Оставить заявку</h2>
            <form action="#" method="post">
                <p>
                    <label for="name">Ваше имя:</label><br>
                    <input type="text" id="name" name="name" size="30">
                </p>
                <p>
                    <label for="phone">Телефон:</label><br>
                    <input type="tel" id="phone" name="phone" size="30">
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" size="30">
                </p>
                <p>
                    <label for="kit">Выберите аптечку:</label><br>
                    <select id="kit" name="kit">
                        <option value="car">Автомобильная</option>
                        <option value="home">Домашняя</option>
                        <option value="travel">Туристическая</option>
                        <option value="kids">Детская</option>
                    </select>
                </p>
                <p>
                    <label for="comment">Комментарий:</label><br>
                    <textarea id="comment" name="comment" rows="4" cols="30"></textarea>
                </p>
                <p>
                    <button type="submit" class="btn">Отправить заявку</button>
                </p>
            </form>
        </div>
    </div>

    <div id="footer">
        <p>&copy; 2026 ПАС. Все права защищены.</p>
    </div>

</body>
</html>
