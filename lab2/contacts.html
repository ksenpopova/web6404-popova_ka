<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПАС — Контакты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="main-header">
        <div class="header-container">
            <div class="logo">
                <img src="images/logo.png" alt="Логотип ПАС" width="50" height="50">
                <span class="logo-text">П<strong>А</strong>С</span>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="composition.html" class="nav-link">Состав</a>
                <a href="contacts.html" class="nav-link active">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <h1 class="page-title">Свяжитесь с нами</h1>

        <div class="contacts-layout">
            <div class="contact-info">
                <h2>Наши контакты</h2>
                <p><strong>Адрес:</strong> г. Самара, ул. Верхне-карьерная, д. 3</p>
                <p><strong>Телефон:</strong> <a href="tel:+78001234567">8 (800) 123-45-67</a></p>
                <p><strong>Email:</strong> <a href="mailto.info@pas.ru">info@pas.ru</a></p>
                <p><strong>Режим работы:</strong> Пн–Пт, 9:00–18:00</p>
                <p>Полезная ссылка: <a href="https://www.mchs.gov.ru" target="_blank" class="external-link">Сайт МЧС России</a></p>
            </div>

            <div class="contact-form">
                <h2>Оставить заявку</h2>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.ru">
                    </div>
                    <div class="form-group">
                        <label for="kit">Выберите аптечку:</label>
                        <select id="kit" name="kit">
                            <option value="car">Автомобильная</option>
                            <option value="home">Домашняя</option>
                            <option value="travel">Туристическая</option>
                            <option value="kids">Детская</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="comment">Комментарий:</label>
                        <textarea id="comment" name="comment" rows="4" placeholder="Ваши пожелания..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить заявку</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 ПАС. Все права защищены.</p>
    </footer>

</body>
</html>
